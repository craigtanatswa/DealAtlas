name: Ingest open notices

# Find a Tender, then Contracts Finder, Public Contracts Scotland, Sell2Wales,
# GCA, grants, then TED Search API v3.
# Devolved portal failures must not skip Find a Tender publish.
# A TED or GCA fetch failure uses continue-on-error so it cannot fail the job
# or skip Find a Tender publish. Row parse errors still exit 0.
# Manual dispatch defaults to dry_run so a click fetches and counts without writing.
# The daily cron ingests (21:00 UTC, 23:00 CAT). A separate daily cron only unpublishes expired deals.
# scheduled-jobs.yml is not part of this workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and count without writing
        type: boolean
        default: true
      backfill_days:
        description: Days of Find a Tender tender releases to read
        type: string
        default: "7"
      publish_only:
        description: Skip ingest and preview rebuild
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * *"
    - cron: "17 5 * * *"
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-open.yml"
      - "lib/jobs/**"

permissions:
  contents: read

concurrency:
  group: dealatlas-ingest-open
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest Find a Tender
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_only != true) || github.event.schedule == '0 21 * * *'
    runs-on: ubuntu-latest
    environment: ingest
    timeout-minutes: 300
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Ingest open Find a Tender notices
        id: ingest
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '7' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          BACKFILL_DAYS="$(printf '%s' "$BACKFILL_DAYS" | tr -d '[:space:]')"
          BACKFILL_DAYS="${BACKFILL_DAYS%.0}"
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*) echo "backfill_days must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 366 ]; then
            echo "backfill_days must be from 1 to 366" >&2
            exit 1
          fi
          npm run ingest-open

      - name: Ingest open Contracts Finder notices
        id: contracts_finder
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_days || '7' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: contracts-finder
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          BACKFILL_DAYS="$(printf '%s' "$BACKFILL_DAYS" | tr -d '[:space:]')"
          BACKFILL_DAYS="${BACKFILL_DAYS%.0}"
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*) echo "backfill_days must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 366 ]; then
            echo "backfill_days must be from 1 to 366" >&2
            exit 1
          fi
          npm run ingest-open

      - name: Ingest open Public Contracts Scotland notices
        id: public_contracts_scotland
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_days || '7' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: public-contracts-scotland
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          BACKFILL_DAYS="$(printf '%s' "$BACKFILL_DAYS" | tr -d '[:space:]')"
          BACKFILL_DAYS="${BACKFILL_DAYS%.0}"
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*) echo "backfill_days must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 366 ]; then
            echo "backfill_days must be from 1 to 366" >&2
            exit 1
          fi
          npm run ingest-open

      - name: Ingest open Sell2Wales notices
        id: sell2wales
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_days || '7' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: sell2wales
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          BACKFILL_DAYS="$(printf '%s' "$BACKFILL_DAYS" | tr -d '[:space:]')"
          BACKFILL_DAYS="${BACKFILL_DAYS%.0}"
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*) echo "backfill_days must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 366 ]; then
            echo "backfill_days must be from 1 to 366" >&2
            exit 1
          fi
          npm run ingest-open

      - name: Ingest Government Commercial Agency agreements
        id: gca_agreements
        if: always() && steps.ingest.outcome != 'cancelled'
        continue-on-error: true
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: gca-agreements
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          npm run ingest-open

      - name: Ingest Government Commercial Agency pipeline
        id: gca_pipeline
        if: always() && steps.ingest.outcome != 'cancelled'
        continue-on-error: true
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: gca-procurement-pipeline
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          npm run ingest-open

      - name: Ingest Find a Grant
        id: find_a_grant
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: find-a-grant
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          npm run ingest-open

      - name: Ingest Innovate UK competitions
        id: innovate_uk
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: innovate-uk
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          npm run ingest-open


      - name: Ingest open TED notices
        id: ted
        continue-on-error: true
        if: always() && steps.ingest.outcome != 'cancelled'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_days || '7' }}
          OPEN_INGEST_PHASE: ingest
          OPEN_INGEST_SOURCE: ted
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          BACKFILL_DAYS="$(printf '%s' "$BACKFILL_DAYS" | tr -d '[:space:]')"
          BACKFILL_DAYS="${BACKFILL_DAYS%.0}"
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*) echo "backfill_days must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 366 ]; then
            echo "backfill_days must be from 1 to 366" >&2
            exit 1
          fi
          npm run ingest-open

      - name: Build previews
        id: build
        if: always() && steps.ingest.outcome != 'cancelled' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          DRY_RUN: "false"
          OPEN_INGEST_PHASE: previews
          OPEN_INGEST_STATE: ${{ runner.temp }}/open-ingest-changed.json
        run: npm run ingest-open

      - name: Unpublish stale previews
        id: unpublish
        if: always() && steps.ingest.outcome != 'cancelled' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job unpublish-stale --mode live

      - name: Publish eligible previews
        id: publish
        # Row parse errors exit 0 so build, unpublish and publish still run.
        # A Find a Tender fetch failure or a failed preview build skips publish.
        # Contracts Finder, Public Contracts Scotland, Sell2Wales, Find a Grant, and Innovate UK failures do not skip publish.
        # Those steps still fail the job.
        # A Government Commercial Agency or TED failure is continue-on-error and does not skip publish.
        if: always() && steps.ingest.outcome == 'success' && steps.build.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job publish-eligible --mode live

      - name: Publish alert
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && (steps.unpublish.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.publish.outcome == 'skipped')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job publish-alert --mode live

      - name: Alert
        if: always()
        env:
          INGEST_COUNTS: ${{ steps.ingest.outputs.counts }}
          BUILD_COUNTS: ${{ steps.build.outputs.counts }}
          INGEST_OK: ${{ steps.ingest.outcome == 'success' && '1' || '0' }}
          CONTRACTS_FINDER_OK: ${{ steps.contracts_finder.outcome == 'success' && '1' || '0' }}
          PUBLIC_CONTRACTS_SCOTLAND_OK: ${{ steps.public_contracts_scotland.outcome == 'success' && '1' || '0' }}
          SELL2WALES_OK: ${{ steps.sell2wales.outcome == 'success' && '1' || '0' }}
          FIND_A_GRANT_OK: ${{ steps.find_a_grant.outcome == 'success' && '1' || '0' }}
          INNOVATE_UK_OK: ${{ steps.innovate_uk.outcome == 'success' && '1' || '0' }}
          GCA_AGREEMENTS_OK: ${{ steps.gca_agreements.outcome == 'success' && '1' || '0' }}
          GCA_PIPELINE_OK: ${{ steps.gca_pipeline.outcome == 'success' && '1' || '0' }}
          TED_OK: ${{ steps.ted.outcome == 'success' && '1' || '0' }}
          BUILD_OK: ${{ steps.build.outcome == 'success' && '1' || '0' }}
          UNPUBLISH_OK: ${{ steps.unpublish.outcome == 'success' && '1' || '0' }}
          PUBLISH_OK: ${{ steps.publish.outcome == 'success' && '1' || '0' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run ingest-alert

  unpublish:
    name: Unpublish expired deals
    if: github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-latest
    environment: ingest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unpublish stale previews
        id: unpublish
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job unpublish-stale --mode live

      - name: Publish alert
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job publish-alert --mode live

  publish:
    name: Publish eligible previews
    if: github.event.schedule == '23 */6 * * *' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only == true)
    runs-on: ubuntu-latest
    environment: ingest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Backfill missing previews
        if: always()
        env:
          DRY_RUN: "false"
          OPEN_INGEST_PHASE: previews
        run: npm run ingest-open

      - name: Unpublish stale previews
        id: unpublish
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job unpublish-stale --mode live

      - name: Publish eligible previews
        id: publish
        if: always() && steps.unpublish.outcome != 'cancelled'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job publish-eligible --mode live

      - name: Publish alert
        if: always() && steps.unpublish.outcome != 'cancelled'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEALATLAS_EMAIL_FROM: ${{ secrets.DEALATLAS_EMAIL_FROM }}
          LEAK_ALERT_EMAIL_TO: ${{ secrets.LEAK_ALERT_EMAIL_TO }}
        run: npm run job -- --job publish-alert --mode live
