name: Ingest open notices

# Find a Tender only, via the official OCDS release-package API.
# Manual dispatch defaults to dry_run so a click fetches and counts without writing.
# The cron writes. scheduled-jobs.yml is not part of this workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and count without writing
        type: boolean
        default: true
      backfill_days:
        description: Days of Find a Tender tender releases to read
        type: number
        default: 7
  schedule:
    - cron: "41 4 */3 * *"

permissions:
  contents: read

concurrency:
  group: dealatlas-ingest-open
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest Find a Tender
    runs-on: ubuntu-latest
    environment: ingest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Ingest open Find a Tender notices
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKFILL_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_days || '7' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          case "$DRY_RUN" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          case "$BACKFILL_DAYS" in
            ''|*[!0-9]*) echo "backfill_days must be a positive integer" >&2; exit 1 ;;
          esac
          if [ "$BACKFILL_DAYS" -lt 1 ] || [ "$BACKFILL_DAYS" -gt 366 ]; then
            echo "backfill_days must be from 1 to 366" >&2
            exit 1
          fi
          npm run ingest-open
