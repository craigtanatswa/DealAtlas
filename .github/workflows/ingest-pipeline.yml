name: Ingest infrastructure pipeline

# Ingests only uk-infrastructure-pipeline, then rebuilds previews and runs the
# same publish-eligible leak gate as ingest-open. Manual dispatch only: there is
# no schedule until Craig approves one. No alert email step and no recipient.
# scheduled-jobs.yml stays disabled and is not used.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run fetches and counts without writing; live writes
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

permissions:
  contents: read

concurrency:
  group: dealatlas-ingest-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest infrastructure pipeline
    runs-on: ubuntu-latest
    environment: ingest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Ingest
        id: ingest
        timeout-minutes: 20
        run: |
          set -euo pipefail
          case "$MODE" in
            dry-run|live) ;;
            *) echo "mode must be dry-run or live" >&2; exit 1 ;;
          esac
          npm run job -- --job ingest --source uk-infrastructure-pipeline --mode "$MODE"

      - name: Build previews
        id: build
        if: steps.ingest.outcome == 'success' && inputs.mode == 'live'
        timeout-minutes: 10
        run: npm run job -- --job previews --mode live

      - name: Publish eligible previews
        # Same leak gate and publish path as ingest-open.
        if: steps.ingest.outcome == 'success' && steps.build.outcome == 'success' && inputs.mode == 'live'
        timeout-minutes: 10
        run: npm run job -- --job publish-eligible --mode live
