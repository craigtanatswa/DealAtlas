name: CI

# Pull request gate. Runs with NO repository secrets and NO production URLs:
# static jobs use localhost placeholders, DB/E2E jobs use a throwaway local
# Supabase stack started inside the runner. The "Scheduled jobs" workflow is
# separate and intentionally untouched.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Cancel superseded PR runs. Main pushes get a per-SHA group so they never cancel
  # each other and every merge keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Local-only placeholders. Real values never belong in this file.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  SUPABASE_SECRET_KEY: ci-placeholder-secret-key
  DODO_PAYMENTS_ENVIRONMENT: test_mode
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest also globs tests/integration; those suites skip themselves when
      # DEALATLAS_DB_TEST_* is unset, so scope this job to unit tests only.
      - run: npx vitest run tests/unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  database:
    name: Database tests (pgTAP + REST)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client
      # npm run test:db = supabase test db (all pgTAP files) + scripts/check-rollbacks.mjs
      # (0019/0018 rollbacks inside a rolled-back transaction, via psql) + vitest
      # tests/integration (PostgREST RLS, auth and public-discovery leak tests).
      - run: npm run test:db
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The suite exercises the production build (`next start`), with the local
      # Supabase URL/keys baked in for NEXT_PUBLIC_* values.
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  gate-parity:
    name: Gate parity (TS/SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      # The same synthetic cases (tests/fixtures/leak-gate/cases.json) drive both scanners.
      - name: Check the generated pgTAP parity file is current
        run: |
          npm run db:gen-leak-parity
          git diff --exit-code -- supabase/tests/database/leak_gate_parity.test.sql
      - name: TypeScript scanner parity
        run: npx vitest run tests/unit/leak-gate-parity.test.ts
      - name: SQL gate parity (pgTAP)
        run: npx supabase test db --local supabase/tests/database/leak_gate_parity.test.sql
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  leak-regression:
    name: Leak regression (local)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAK_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-ZQLEAKTEST0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record head and merge SHAs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "LEAK_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            echo "LEAK_MERGE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "LEAK_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client
      # The pre-0019 phase models production after the app deploy and before the lockdown.
      - name: Hold back migration 0019
        run: |
          mkdir -p "$RUNNER_TEMP/held-migrations"
          mv supabase/migrations/0019_*.sql "$RUNNER_TEMP/held-migrations/"
      - name: Start local Supabase (migrations 0001-0018)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - name: Check 0019 is not applied
        run: |
          applied="$(psql "$DEALATLAS_DB_TEST_DB_URL" -XAt -c "select count(*) from supabase_migrations.schema_migrations where version like '0019%'")"
          test "$applied" = "0"
          test "$(psql "$DEALATLAS_DB_TEST_DB_URL" -XAt -c "select pg_catalog.to_regclass('private.pre_0019_acl') is null")" = "t"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Baseline crawl on the unseeded app
        run: |
          bash tests/leak/start-app.sh baseline "$RUNNER_TEMP/next-start.log"
          npx tsx tests/leak/preflight.ts --baseline
          bash tests/leak/stop-app.sh
      - name: Seed the synthetic protected-token world
        run: |
          npx tsx tests/leak/seed/users.ts
          bash tests/leak/seed/apply.sh
      - name: Preflight and phase A
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .leak/started-at
          bash tests/leak/start-app.sh A "$RUNNER_TEMP/next-start.log"
          npx tsx --import ./scripts/allow-server-only.mjs tests/leak/preflight.ts
          npx tsx --import ./scripts/allow-server-only.mjs tests/leak/run.ts --phase A
          bash tests/leak/stop-app.sh
      - name: Apply 0019
        if: ${{ !cancelled() }}
        run: |
          mv "$RUNNER_TEMP"/held-migrations/0019_*.sql supabase/migrations/
          npx supabase migration up --local
          test "$(psql "$DEALATLAS_DB_TEST_DB_URL" -XAt -c "select pg_catalog.to_regclass('private.pre_0019_acl') is not null")" = "t"
      - name: Phase B
        if: ${{ !cancelled() }}
        run: |
          bash tests/leak/start-app.sh B "$RUNNER_TEMP/next-start.log"
          npx tsx --import ./scripts/allow-server-only.mjs tests/leak/run.ts --phase B
      - name: HTTP leak suite against the built app
        if: ${{ !cancelled() }}
        env:
          DEALATLAS_APP_URL: http://127.0.0.1:3100
        run: npx vitest run tests/integration/public-discovery.rest.test.ts
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          bash tests/leak/stop-app.sh
          npx tsx tests/leak/report.ts
      - name: Name the artifact
        if: always()
        run: echo "LEAK_ARTIFACT=leak-probes-${LEAK_HEAD_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Upload leak probes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.LEAK_ARTIFACT }}
          path: leak-artifacts/
          retention-days: 30
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  # Informational only: runner timing is not production timing, so this job is
  # not a required check and has no thresholds. It fails only if the script errors.
  write-timing:
    name: Preview write timing (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-client
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - name: Time preview writes (20,000 filler deals)
        run: node scripts/preview-write-timing.mjs "$DEALATLAS_DB_TEST_DB_URL" --deals 20000 --samples 15 --out write-timing
      - name: Upload write timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-write-timing
          path: write-timing/
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
