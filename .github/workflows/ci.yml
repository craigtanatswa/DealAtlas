name: CI

# Pull request gate. Runs with NO repository secrets and NO production URLs:
# static jobs use localhost placeholders, DB/E2E jobs use a throwaway local
# Supabase stack started inside the runner. The "Scheduled jobs" workflow is
# separate and intentionally untouched.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Cancel superseded PR runs. Main pushes get a per-SHA group so they never cancel
  # each other and every merge keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Local-only placeholders. Real values never belong in this file.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  SUPABASE_SECRET_KEY: ci-placeholder-secret-key
  DODO_PAYMENTS_ENVIRONMENT: test_mode
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest also globs tests/integration; those suites skip themselves when
      # DEALATLAS_DB_TEST_* is unset, so scope this job to unit tests only.
      - run: npx vitest run tests/unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  database:
    name: Database tests (pgTAP + REST)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      # npm run test:db = supabase test db (pgTAP) + vitest tests/integration
      # (PostgREST RLS, auth and public-discovery leak tests) against the local stack.
      - run: npm run test:db
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,storage-api
      - name: Export local Supabase connection details
        run: ./scripts/ci-export-supabase-env.sh
      - name: Guard against production environment
        run: node scripts/ci-guard-env.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The suite exercises the production build (`next start`), with the local
      # Supabase URL/keys baked in for NEXT_PUBLIC_* values.
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # Follow-up (after PR #1 "DB gate lockdown" merges): add the jobs below as
  # separate, clearly named jobs and then add their names to branch protection.
  #
  #   pgtap-gate:        name: "pgTAP gate lockdown"   -> supabase test db for the new gate tests
  #   gate-parity:       name: "Gate parity"           -> preview/canonical gate parity tests
  #   leak-regression:   name: "Leak regression"       -> phrase-overlap / synthetic-fixture leak suite
  #
  # Each should reuse the "Start local Supabase" + "Export local Supabase
  # connection details" + "Guard against production environment" steps above.
  # ---------------------------------------------------------------------------
